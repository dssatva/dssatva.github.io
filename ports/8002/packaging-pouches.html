<html lang="en">

     the Satva Saheli logo removed; the barcode on the right removed; Batch,
     Packed and Best before moved to the right, one below the other, with room
     to print; the other details on the left one below the other; "Packed &
     Marketed by DS Satva Foods Pvt. Ltd."; email instead of the phone number.
     Review page only, noindex. Source design: packaging-cobrand.html #2. -->
<!-- 21 Oct 2026, owner: "Take off the green veg symbol and keep the contents alingned with fssai in capital and place the veg symbol somewhere" - the veg mark left the FSSAI line (which now lines up with the others, FSSAI in capitals) and sits on its own, top-left of the printed front. -->
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>SATVA Pouches</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Jost:wght@300..700&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#2a2a24;color:#f4f3e7;font-family:"Jost",system-ui,sans-serif;padding:0 16px 70px}
header.top{max-width:1500px;margin:0 auto;padding:34px 0 6px}
header.top .k{letter-spacing:.28em;text-transform:uppercase;font-size:.78rem;color:#e3c27a;font-weight:500}
header.top h1{font-family:"Fraunces",serif;font-weight:600;font-size:clamp(1.8rem,3.4vw,2.7rem);margin:8px 0;color:#f1ddab}
header.top p{color:#cfc8b4;max-width:84ch;line-height:1.65}
header.top p b{color:#f4f3e7}
.list{max-width:1500px;margin:30px auto 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:40px 26px}
figure{margin:0;display:flex;flex-direction:column;align-items:center}
figcaption{margin-top:14px;color:#cfc8b4;font-size:.92rem;line-height:1.45;align-self:stretch}
figcaption b{color:#f1ddab;font-family:"Fraunces",serif;font-size:1.08rem;margin-right:6px;display:block}
.stage{height:420px;display:grid;place-items:center;cursor:zoom-in;outline:none;width:100%;border-radius:14px;background:radial-gradient(ellipse at 50% 40%,#3a3a32,#25251f)}
.stage:focus-visible{box-shadow:0 0 0 3px #e3c27a}
.full{position:fixed;inset:0;z-index:50;height:auto;border-radius:0;background:rgba(14,14,10,.94);cursor:zoom-out}
.full .pk{transform:scale(var(--z,1.9))}
body.isfull{overflow:hidden}
.hint{display:none;position:fixed;z-index:60;top:14px;right:16px;background:rgba(0,0,0,.65);color:#fff;padding:8px 14px;border-radius:99px;font-size:.9rem}
body.isfull .hint{display:block}

/* ---------- the pouch ---------- */
.pk{position:relative;transition:transform .3s}
.pouch{width:250px;height:370px;background:var(--bg);color:var(--ink);border-radius:10px 10px 22px 22px/10px 10px 30px 30px;
  padding:30px 20px 10px;display:flex;flex-direction:column;align-items:center;text-align:center;overflow:hidden;
  box-shadow:0 30px 40px -24px rgba(0,0,0,.7),inset 0 -14px 20px -14px rgba(0,0,0,.18),inset 10px 0 16px -12px rgba(255,255,255,.35),inset -10px 0 16px -12px rgba(0,0,0,.12)}
.pouch::before{content:"";position:absolute;left:0;right:0;top:0;height:16px;background:repeating-linear-gradient(90deg,rgba(0,0,0,.07) 0 2px,transparent 2px 5px);border-bottom:1px solid rgba(0,0,0,.08);z-index:3}
.pouch::after{content:"";position:absolute;right:-4px;top:22px;width:8px;height:8px;border-radius:50%;background:#25251f;z-index:3}
.kraft{background-image:radial-gradient(rgba(60,30,10,.18) .8px,transparent 1.2px),radial-gradient(rgba(255,240,210,.14) .8px,transparent 1.2px);background-size:5px 5px,7px 7px;background-position:0 0,2px 3px}

/* shared parts */
.sah{display:flex;align-items:center;gap:8px;text-align:left;position:relative;z-index:2}
.sah img{width:40px;height:auto;flex:none}
.sah b{display:block;font:600 15px/1 "Fraunces",serif;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.sah b span{color:var(--acc)}
.sah i{display:block;margin-top:4px;font:italic 400 9.5px/1.25 "Fraunces",serif;color:var(--acc);max-width:150px}
.sah.sm img{width:32px}.sah.sm b{font-size:12.5px}.sah.sm i{font-size:8.5px}
.sah.xs img{width:24px}.sah.xs b{font-size:10.5px}.sah.xs i{font-size:7.2px;margin-top:2px}
.sah.st{flex-direction:column;text-align:center;gap:4px}
.dark .sah b span{color:var(--acc)}
.nm{margin-top:auto;position:relative;z-index:2}
.nm h3{font:600 38px/.95 "Fraunces",serif;color:var(--ink);letter-spacing:-.01em}
.nm h3 small{display:block;font:500 15px/1.2 "Jost";letter-spacing:.34em;text-transform:uppercase;margin-top:6px;color:var(--acc)}
.nm .dv{margin-top:6px;font:400 17px/1.2 "Tiro Devanagari Hindi",serif;color:var(--acc)}
.nm.sm h3{font-size:28px}.nm.sm h3 small{font-size:11px}.nm.sm .dv{font-size:13px}
.nm.mid h3{font-size:42px}
.nm.lt h3,.nm.lt h3 small,.nm.lt .dv{color:#fffaf0}
.nm.airy{margin-top:auto;margin-bottom:6px}.nm.airy h3{font-weight:400;font-size:40px}
.dot{display:block;width:6px;height:6px;border-radius:50%;background:var(--acc);margin:12px auto 0;flex:none}
.sp{margin-top:auto;position:relative;z-index:2;width:100%}
.sp ul{list-style:none;display:flex;justify-content:center;flex-wrap:wrap;gap:4px 10px}
.sp li{font:500 8.5px/1.2 "Jost";letter-spacing:.14em;text-transform:uppercase;color:var(--ink);opacity:.85}
.sp li+li::before{content:"\2022";margin-right:10px;color:var(--acc)}
.sp .wt,.wt{margin-top:6px;font:500 11px/1 "Jost";letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.wt b{font-weight:700;color:var(--acc)}
.wt.c{text-align:center;margin-top:8px}
.sp.row{margin-top:10px}
.sp.min ul{gap:2px 8px}.sp.min li{font-size:7.5px;opacity:.7}
.sp.tiny{margin-top:8px}.sp.tiny ul{flex-direction:column;gap:2px}.sp.tiny li::before{display:none}
.ds{margin-top:8px;position:relative;z-index:2}
.ds img{height:46px;display:block;margin:0 auto}
.ds.sm img{height:36px}.ds.xs img{height:26px}
.ds.h img{height:22px}.ds.h.xs img{height:16px}
.fine{margin-top:6px;font:400 6.4px/1.4 "Jost";color:var(--ink);opacity:.7;letter-spacing:.02em;position:relative;z-index:2}
.fine.lt{color:#fff4e0;opacity:.85}

/* variant parts */
.band{margin:14px -20px 0;padding:18px 10px 16px;width:calc(100% + 40px);margin-top:auto}
.band .nm{margin-top:0}
.band+.sp{margin-top:14px}
.sash{position:absolute;left:-60px;top:46px;width:330px;transform:rotate(-24deg);background:#b4707a;color:#fff;padding:7px 0 7px 70px;display:flex;align-items:center;gap:6px;z-index:2;box-shadow:0 6px 12px -6px rgba(0,0,0,.4)}
.sash img{width:20px}
.sash span{font:500 7.6px/1.2 "Jost";letter-spacing:.1em;text-transform:uppercase;text-align:left}
.win{margin-top:12px;position:relative;overflow:hidden;flex:none;box-shadow:inset 0 3px 8px rgba(0,0,0,.25);border:2px solid rgba(255,255,255,.6)}
.win.oval{width:130px;height:84px;border-radius:50%}
.win.arch{width:106px;height:104px;border-radius:60px 60px 8px 8px}
.grain{position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.25),transparent 60%),radial-gradient(rgba(0,0,0,.22) 1px,transparent 1.6px),radial-gradient(rgba(255,255,255,.18) 1px,transparent 1.6px),var(--c);background-size:auto,4px 4px,6px 6px,auto;background-position:0 0,0 0,2px 3px,0 0}
.top{margin:-30px -20px 0;padding:30px 20px 18px;width:calc(100% + 40px);height:200px;display:flex;flex-direction:column;align-items:center}
.top .sah{align-self:center}.top .sah b,.top .sah i,.top .sah b span{color:#fff6e6}
.top .nm{margin-top:auto}
.sprig{width:50px;height:66px;margin-top:14px}
.photo{margin:-30px -20px 0;width:calc(100% + 40px);height:130px;flex:none}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo+.sah{margin-top:12px}
.seal{position:relative;width:96px;height:96px;flex:none;margin-top:4px}
.seal img{position:absolute;left:50%;top:50%;width:40px;transform:translate(-50%,-50%)}
.seal svg{position:absolute;inset:0}
.seal text{font:600 8.4px "Jost";letter-spacing:.14em;fill:var(--acc)}
.seal::before{content:"";position:absolute;inset:14px;border-radius:50%;border:1px dashed var(--acc);opacity:.6}
.cap{margin-top:6px;font:italic 400 10px/1.3 "Fraunces",serif;color:var(--acc)}
.story{margin-top:10px;font:italic 400 9px/1.45 "Fraunces",serif;color:var(--ink);opacity:.85;max-width:190px;border-top:1px solid rgba(0,0,0,.12);padding-top:8px}
.nm.dvf .dv{font-size:40px;line-height:1;color:var(--ink);margin:0}
.nm.dvf h3{font:500 13px/1 "Jost";letter-spacing:.3em;text-transform:uppercase;color:var(--acc);margin-top:10px}
.stripes{position:absolute;left:0;right:0;top:16px;height:22px;background:linear-gradient(90deg,#d99a1c 0 20%,#b8342a 20% 40%,#7a4a2a 40% 60%,#8a8a3a 60% 80%,#2c4220 80%);z-index:1}
.stripes+.sah{margin-top:18px}
.lbl{margin-top:4px;background:#f6efe2;border-radius:6px;padding:14px 12px 12px;width:100%;flex:1;display:flex;flex-direction:column;align-items:center;box-shadow:0 4px 10px -4px rgba(0,0,0,.35)}
.lbl .sah{align-self:center}.lbl .nm{margin-top:auto}
.vert{position:absolute;left:10px;top:30px;bottom:20px;display:flex;align-items:center;writing-mode:vertical-rl;transform:rotate(180deg);z-index:2}
.vert h3{font:600 30px/1 "Fraunces",serif;letter-spacing:.04em;text-transform:uppercase;color:var(--acc);opacity:.95}
.pouch:has(.vert){padding-left:52px}
.dv.big{margin-top:auto;font:400 30px/1.1 "Tiro Devanagari Hindi",serif;color:var(--ink)}
.pat{position:absolute;inset:0;background-image:url("assets/saheli-mark-grad.svg");background-size:26px;opacity:.13;z-index:1}
.card{margin-top:auto;background:var(--bg);border-radius:12px;padding:14px 14px 12px;position:relative;z-index:2;box-shadow:0 6px 18px -8px rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;gap:10px}
.card .nm{margin-top:0}
.card+.sp{margin-top:12px;background:var(--bg);border-radius:8px;padding:6px}
.ring{margin-top:auto;width:150px;height:150px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:radial-gradient(circle,var(--bg) 0 60%,transparent 60.5%),repeating-conic-gradient(var(--acc) 0 2deg,transparent 2deg 10deg);position:relative}
.ring::after{content:"";position:absolute;inset:16px;border-radius:50%;border:1px solid var(--acc);opacity:.5}
.ring .nm{margin:0}
.ring+.sp{margin-top:10px}
.shelf{font:600 9px/1 "Jost";letter-spacing:.3em;text-transform:uppercase;color:var(--acc);background:rgba(255,255,255,.55);padding:5px 10px;border-radius:99px;margin-bottom:10px}
.meet{display:flex;align-items:center;gap:8px;text-align:left;background:rgba(255,255,255,.55);padding:6px 12px 6px 6px;border-radius:99px}
.meet img{width:40px;height:40px;border-radius:50%;object-fit:cover}
.meet b{display:block;font:600 11.5px/1 "Fraunces",serif;letter-spacing:.06em;text-transform:uppercase}
.meet i{display:block;margin-top:3px;font:italic 400 8px/1.2 "Fraunces",serif;color:var(--acc)}
.zip{position:absolute;left:12px;right:12px;top:24px;height:3px;border-radius:3px;background:rgba(0,0,0,.14)}
.ico{margin-top:auto;display:flex;gap:14px;justify-content:center}
.ico span{display:flex;flex-direction:column;align-items:center;gap:4px;font:500 7.5px/1 "Jost";letter-spacing:.14em;text-transform:uppercase}
.ico svg{width:24px;height:24px;fill:none;stroke:var(--acc);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.stamp{margin-top:6px;background:#fff9ee;padding:12px 14px;position:relative;
  border:6px dotted #f2ead8;outline:1px dashed var(--acc);outline-offset:-12px;box-shadow:0 0 0 1px rgba(0,0,0,.08);padding:16px 18px}

/* ---------- other formats ---------- */
.box{width:300px;height:300px;position:relative;display:flex;transform:perspective(900px) rotateY(-8deg)}
.box .face{width:190px;height:290px;background:var(--bg);color:var(--ink);padding:22px 16px 14px;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:0 30px 40px -24px rgba(0,0,0,.7);border-radius:3px 0 0 3px}
.box .face .nm{margin-top:auto}.box .face .ds{margin-top:auto}
.box .side{width:105px;height:290px;background:color-mix(in srgb,var(--bg) 86%,#000);color:var(--ink);padding:18px 10px;font-size:8px;line-height:1.4;text-align:left;border-radius:0 3px 3px 0;box-shadow:inset 8px 0 12px -8px rgba(0,0,0,.25)}
.side .sideh{font:600 11px/1 "Fraunces",serif;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.side p{font-style:italic;color:var(--acc)}
.side .sp ul{justify-content:flex-start}.side .sp li{font-size:7px}.side .sp .wt{font-size:9px}
.jar{width:220px;height:330px;position:relative;display:flex;flex-direction:column;align-items:center;color:var(--ink)}
.jar .lid{width:170px;height:44px;border-radius:8px 8px 4px 4px;background:linear-gradient(90deg,#7a5a2a,#c89a4a 40%,#8a6a32);box-shadow:inset 0 -6px 8px rgba(0,0,0,.25)}
.jar .glass{width:210px;height:282px;margin-top:-2px;border-radius:26px;position:relative;overflow:hidden;box-shadow:0 30px 40px -24px rgba(0,0,0,.7),inset 0 0 0 3px rgba(255,255,255,.25)}
.jar .glass .grain{inset:0}
.jar .glass::after{content:"";position:absolute;left:14px;top:10px;width:16px;bottom:10px;border-radius:10px;background:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,0))}
.jl{position:absolute;left:0;right:0;top:40px;bottom:26px;background:var(--bg);padding:12px 14px;display:flex;flex-direction:column;align-items:center;text-align:center}
.jl .nm{margin-top:10px}.jl .ds{margin-top:auto}
.sachet{width:170px;height:240px;background:var(--bg);color:var(--ink);padding:24px 14px 12px;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;
  box-shadow:0 26px 34px -22px rgba(0,0,0,.7);
  -webkit-mask:linear-gradient(#000 0 0) center/100% calc(100% - 12px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/8px 6px repeat-x,conic-gradient(from 135deg at top,#0000,#000 1deg 89deg,#0000 90deg) top/8px 6px repeat-x;
  mask:linear-gradient(#000 0 0) center/100% calc(100% - 12px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/8px 6px repeat-x,conic-gradient(from 135deg at top,#0000,#000 1deg 89deg,#0000 90deg) top/8px 6px repeat-x}
.sachet .sah{background:rgba(255,255,255,.7);padding:6px 8px;border-radius:8px}
.sachet .sah b span,.sachet .sah i{color:#7a4a0a}
.sachet .nm{margin-top:auto}.sachet .nm h3 small,.sachet .nm .dv{color:#3a2508}
.sachet .ds{margin-top:auto}
.gift{width:300px;height:250px;position:relative}
.gift .lidg{position:absolute;inset:0;background:var(--bg);color:var(--ink);border-radius:6px;padding:22px;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:0 30px 40px -24px rgba(0,0,0,.7),inset 0 0 0 6px rgba(227,194,122,.25)}
.giftt{max-width:220px;margin-top:14px;font:600 22px/1.1 "Fraunces",serif;color:var(--ink)}
.gsub{max-width:220px;margin-top:6px;font:500 8.5px/1.3 "Jost";letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.gift .ds{margin-top:auto}
.ribbon{position:absolute;top:0;bottom:0;right:18px;width:14px;background:linear-gradient(90deg,#b4707a,#d58c96,#b4707a);opacity:.9}
.tag{position:absolute;right:-30px;top:40px;width:96px;background:#fbf6ee;color:#1e2c16;border-radius:6px 6px 6px 6px;padding:18px 8px 10px;text-align:center;transform:rotate(8deg);box-shadow:0 10px 20px -10px rgba(0,0,0,.6);z-index:4}
.tag::before{content:"";position:absolute;top:6px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#2a2a24}
.tag::after{content:"";position:absolute;top:-30px;left:50%;width:1.5px;height:38px;background:#8a6a3a;transform:rotate(-30deg);transform-origin:bottom}
.tag img{width:30px}
.tag b{display:block;font:600 10px/1 "Fraunces",serif;text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.tag i{display:block;font:italic 400 7.5px/1.3 "Fraunces",serif;color:#9a6c12;margin-top:4px}
.tagwrap{position:relative}
.bag{width:240px;height:340px;background:var(--bg);color:var(--ink);border-radius:4px;padding:60px 18px 12px;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;
  background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.035) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(0,0,0,.03) 0 1px,transparent 1px 3px);box-shadow:0 30px 40px -24px rgba(0,0,0,.7)}
.bag::before{content:"";position:absolute;left:0;right:0;top:26px;height:10px;background:repeating-linear-gradient(90deg,#8a6a3a 0 8px,transparent 8px 14px);opacity:.6}
.bag .nm{margin-top:20px}.bag .ds{margin-top:auto}

.list{grid-template-columns:repeat(auto-fill,minmax(min(100%,560px),1fr))}
.stage{height:440px}
.pair{display:flex;gap:22px;transition:transform .3s}
.pair>div{position:relative}
.lab{position:absolute;top:-18px;left:0;font:600 9px/1 "Jost";letter-spacing:.3em;text-transform:uppercase;color:#cfc8b4}
.full .pair{transform:scale(var(--z,1.6))}
.pouch{gap:0}
.pouch .nm{margin-top:14px}
.nm.top{margin-top:10px}
.nm h3{font-size:36px}
.nm.sm h3{font-size:30px}
/* the window: clear film with the product behind it */
.w{position:relative;flex:none;margin:12px auto 0;overflow:hidden;box-shadow:inset 0 2px 6px rgba(0,0,0,.25);outline:1.5px solid rgba(255,255,255,.75);
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.28),transparent 55%),radial-gradient(rgba(0,0,0,.24) 1px,transparent 1.7px),radial-gradient(rgba(255,255,255,.2) 1px,transparent 1.7px),var(--c);
  background-size:auto,4px 4px,6px 6px,auto;background-position:0 0,0 0,2px 3px,0 0}
.w.coarse{background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.25),transparent 55%),radial-gradient(circle,rgba(255,255,255,.35) 0 1.4px,transparent 2px),radial-gradient(circle,rgba(0,0,0,.22) 0 2.6px,transparent 3.6px),var(--c);
  background-size:auto,9px 8px,9px 8px,auto;background-position:0 0,1px 1px,4px 4px,0 0}
.w .gl{position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.42) 40%,transparent 50%)}
.w.circle{width:78px;height:78px;border-radius:50%}
.w.circle.sm{width:58px;height:58px}.w.circle.lg{width:96px;height:96px}
.w.slit{width:150px;height:22px;border-radius:11px}
.w.slit.full{width:calc(100% + 40px);margin:0 -20px;border-radius:0;height:20px}
.w.arch{width:78px;height:92px;border-radius:39px 39px 6px 6px}
.w.arch.narrow{width:52px;height:110px;border-radius:26px 26px 4px 4px;margin:0}
.w.arch.big{width:120px;height:130px;border-radius:60px 60px 8px 8px}
.w.oval{width:110px;height:64px;border-radius:50%}
.w.oval.mini{width:66px;height:40px;margin:0}
.w.pill{width:120px;height:40px;border-radius:20px}
.w.vslit{position:absolute;left:44px;top:40px;bottom:120px;width:16px;border-radius:8px;margin:0}
.w.leaf{width:90px;height:60px;border-radius:0 60px 0 60px;transform:rotate(-12deg)}
.w.dot{width:30px;height:30px;border-radius:50%;margin:0}
.w.stampw{width:110px;height:76px;margin:0;border-radius:2px;outline:none}
.stwin{margin-top:12px;padding:6px;border:2px dashed var(--acc);border-radius:4px}
.w.gapw{width:70px;height:16px;margin:0;border-radius:2px}
.gapband{display:flex;align-items:center;width:calc(100% + 40px);margin:12px -20px 0}
.gapband i{flex:1;height:16px}
.three{display:flex;gap:12px;margin-top:12px}
